{% set name = "calango" %}
{% set version = environ.get("CALANGO_VERSION", "26.7.32") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Build from the working tree (run conda-build from the repo root, or point
  # `path` at a checkout). Swap for a `git_url`/`url`+`sha256` for releases.
  path: ../..

build:
  number: 0
  # GUI desktop app — one architecture-specific binary, not noarch.
  # Skip Windows: the app targets macOS + Linux.
  skip: true  # [win]

requirements:
  # Tools needed to compile Calango.
  build:
    - {{ compiler('cxx') }}          # cxx-compiler (C++20)
    - cmake >=3.21
    - ninja
    - pkg-config

  # Libraries linked / headers compiled against at build time. numpy is a
  # runtime-only dep (used by the embedded Python scripts, not compiled
  # against), so it lives in `run`, not here.
  host:
    - qt6-main >=6.4                 # Widgets / OpenGLWidgets / Concurrent / Svg
    - pybind11 >=2.12
    - python
    # NOTE: Calango uses custom QPainter plot widgets (not QCustomPlot) and
    # Qt's own QJson (not nlohmann_json), so neither is a dependency. They were
    # in the original spec but are dropped here — qcustomplot in particular is
    # not packaged on conda-forge for osx-arm64, which fails the solve.

  # Runtime dependencies pulled into the environment when Calango is installed.
  run:
    - python
    - qt6-main >=6.4
    - numpy >=1.23
    - ase >=3.22                     # structure I/O + calculators
    - scipy >=1.9
    - spglib >=2.0                   # symmetry detection
    - pymatgen                       # Materials Project / structure interop
    - paramiko >=3.0                 # Remote Access SSH/SFTP panel
    # MLIP: MACE is packaged on conda-forge as `pymace`, which pulls its full
    # backend (pytorch, e3nn, cuequivariance-torch, torch-ema, torchmetrics).
    - pymace >=0.3
    # DFT: GPAW is a conda-forge package on x86_64 (linux-64 / osx-64) but is
    # NOT yet built for osx-arm64 (Apple Silicon), where it must be pip-installed
    # (`pip install gpaw`). gpaw-data ships the PAW datasets on every platform.
    - gpaw           # [x86_64]
    - gpaw-data

test:
  commands:
    # ASE-importable embedded interpreter probe (exit 0 == ASE available).
    - calango --probe-python

about:
  home: https://github.com/seixas-research/calango
  license: MIT
  license_file: LICENSE
  summary: Atomistic modeling & simulation GUI (Qt6 + OpenGL + embedded ASE)
  description: |
    Calango is a C++/Qt6 desktop suite for building, visualizing and running
    atomistic simulations (DFT via GPAW, MLIP via MACE, MD, phonons, band
    structure) on top of an embedded CPython/ASE interpreter.

extra:
  recipe-maintainers:
    - seixas-research
